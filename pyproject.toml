[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
exclude = '^(app\.py|policy_coder/|tests/(test_core|test_main_preparation|test_preparation)\.py$)'
files = [
    "generate_version_checklist.py",
    "finalize_proposals.py",
    "tests/test_json_cleanup.py",
    "tests/test_checklist_generation.py",
    "tests/test_finalize_proposals.py",
    "tests/test_proposal_validation.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["generate_version_checklist", "finalize_proposals", "policy_coder"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
