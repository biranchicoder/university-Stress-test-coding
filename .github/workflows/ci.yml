name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: >
          python -m black --check --line-length 100
          generate_version_checklist.py
          finalize_proposals.py
          policy_coder/proposal_validation.py
          tests/test_json_cleanup.py
          tests/test_checklist_generation.py
          tests/test_finalize_proposals.py
          tests/test_proposal_validation.py
      - name: Lint
        run: python -m flake8 .
      - name: Type-check
        run: python -m mypy .
      - name: Test with coverage
        run: >
          python -m pytest -q
          --cov=generate_version_checklist
          --cov=finalize_proposals
          --cov=policy_coder
          --cov-report=html
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
